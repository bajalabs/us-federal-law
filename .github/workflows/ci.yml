name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Unit tests (mappers on committed fixtures)
        run: python3 -m unittest -v
      - name: Quick start (Constitution, no download)
        run: |
          python3 -m usfl build --corpus constitution --db dist/us-constitution.sqlite
          python3 -m usfl verify --db dist/us-constitution.sqlite --allow-partial
          python3 -c "import sqlite3; print(sqlite3.connect('dist/us-constitution.sqlite').execute(\"SELECT label, substr(text, 1, 80) FROM articles WHERE article_key = 'amd-1'\").fetchone())"
